      properties:
        authorizationUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 4096
          description: Backend-generated HTTPS identity-provider URL; the Mock uses its same-origin callback.
        expiresAt:
          type: integer
          minimum: 1
          description: Transaction expiry as Unix epoch milliseconds.
    SsoConfiguration:
      type: object
      additionalProperties: false
      required: [isEnabled, providerName]
      properties:
