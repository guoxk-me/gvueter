          description: Global byte ceiling. Each upload endpoint may enforce a smaller limit.
        allowedExtensions:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Canonical lower-case extensions without leading dots.
          items:
            type: string
