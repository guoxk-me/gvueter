          minLength: 1
          maxLength: 1024
        captchaId:
          type: string
          minLength: 1
          maxLength: 200
        captchaCode:
          type: string
          minLength: 1
          maxLength: 200
        provider:
          type: string
          const: password
        tenantId:
          type: string
          minLength: 1
          maxLength: 200
    SsoExchangeInput:
      type: object
      additionalProperties: false
