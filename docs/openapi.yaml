          $ref: '#/components/schemas/SafeHttpUrl'
        supportEmail:
          type: string
          format: email
          maxLength: 254
        isMaintenanceMode:
          type: boolean
    SystemUploadInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - maxFileSizeMb
        - allowedExtensions
        - endpointUrl
        - region
        - bucketName
        - pathPrefix
        - isPathStyle
        - publicBaseUrl
        - accessKeyId
        - accessKeySecret
      properties:
        provider:
          type: string
          enum: [local, s3]
          description: Local means the backend's deployment-owned filesystem configuration; s3 enables the object-storage fields below.
        maxFileSizeMb:
          type: integer
          minimum: 1
          maximum: 200
          description: Global administrative ceiling in MiB (1,048,576 bytes). Upload endpoints and reverse proxies may enforce smaller limits.
        allowedExtensions:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^[A-Za-z0-9]+(?:,[A-Za-z0-9]+)*$'
          description: Comma-separated extensions without dots; the saved and returned form is canonical lower-case.
        endpointUrl:
          $ref: '#/components/schemas/OptionalSafeHttpUrl'
        region:
          $ref: '#/components/schemas/OptionalS3Region'
        bucketName:
          $ref: '#/components/schemas/OptionalS3BucketName'
        pathPrefix:
          $ref: '#/components/schemas/UploadPathPrefix'
        isPathStyle:
          type: boolean
          description: Enables path-style object-storage addressing when the configured S3-compatible provider requires it.
        publicBaseUrl:
          $ref: '#/components/schemas/OptionalSafeHttpUrl'
        accessKeyId:
          type: string
          maxLength: 500
        accessKeySecret:
          type: string
          maxLength: 4096
          description: Empty means retain the currently stored secret. An S3 configuration without a retained secret must provide one.
      allOf:
        - if:
            properties:
              provider:
                const: s3
            required: [provider]
          then:
            properties:
              endpointUrl:
                $ref: '#/components/schemas/SafeHttpUrl'
              region:
                $ref: '#/components/schemas/S3Region'
              bucketName:
                $ref: '#/components/schemas/S3BucketName'
              accessKeyId:
                type: string
                minLength: 1
                maxLength: 500
