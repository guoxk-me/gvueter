    ApiErrorDetails:
      type: object
      properties:
        requestId:
          type: string
          maxLength: 200
        retryAfterSeconds:
          type: integer
          minimum: 0
        fieldErrors:
          type: object
          additionalProperties:
            oneOf:
              - type: string
                minLength: 1
                maxLength: 1000
              - type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 1000
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
    PageRequest:
      type: object
      additionalProperties: false
      required: [page, pageSize]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        sortField:
          type: string
          minLength: 1
        sortDirection:
          type: string
          enum: [asc, desc]
        keyword:
          type: string
          maxLength: 200
    PageResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/JsonValue'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
    UploadReceipt:
      type: object
      additionalProperties: false
      required: [fileId, fileName, contentType, sizeBytes, uploadedAt]
      properties:
        fileId:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
          maxLength: 180
          pattern: '^(?!\.)(?!.*[\\/])(?!.*\.$)[^\x00-\x1F\x7F]+$'
        contentType:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[\w!#$&^.+-]+/[\w!#$&^.+-]+$'
        sizeBytes:
          type: integer
          minimum: 0
        uploadedAt:
          type: string
          format: date-time
    BusinessTimeZone:
      type: string
      maxLength: 200
      pattern: '^(?:UTC|[A-Za-z_+-]+(?:/[A-Za-z0-9_+.-]+)+)$'
      description: UTC or an IANA time-zone identifier such as Asia/Shanghai.
    BinaryPayload:
      type: string
      format: binary
    DemoUploadCompletionInput:
      type: object
      additionalProperties: false
      required: [fileName, mimeType, totalChunks]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 180
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, text/csv]
        totalChunks:
          type: integer
          minimum: 1
          maximum: 128
    DemoUploadCompletion:
      type: object
      additionalProperties: false
      required: [serverFileId, resultUrl]
      properties:
        serverFileId:
          type: string
          minLength: 1
          maxLength: 200
        resultUrl:
          type: string
          pattern: ^/api/component-gallery/files/
          maxLength: 4000
    DemoUploadCompletionEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DemoUploadCompletion'
