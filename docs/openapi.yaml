openapi: 3.1.0
info:
  title: Gvueter Admin API Contract
  version: 0.1.0
  description: Complete Mock endpoint inventory with closed JSON mutation DTOs plus shared envelope, pagination, error, upload, date, and trace schemas.
servers:
  - url: /api/v1
    description: Paired production gateway for gnester-lite's default URI-versioned controllers
  - url: /api
    description: Same-origin API base used by the deterministic Mock server
security:
  - bearerAuth: []
paths:
  /auth/captcha:
    get:
      security: []
      summary: Create a login CAPTCHA challenge
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      security: []
      summary: Start an authenticated browser session
      requestBody:
        $ref: '#/components/requestBodies/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        default:
          $ref: '#/components/responses/Error'
  /auth/sso/config:
    get:
      security: []
      summary: Read the safe public SSO login option
      description: Returns only availability and a display label. Provider endpoints, client IDs, and secrets are never exposed.
      responses:
        '200':
          $ref: '#/components/responses/SsoConfigurationSuccess'
        default:
          $ref: '#/components/responses/Error'
  /auth/sso/start:
    post:
      security: []
      summary: Start a backend-owned SSO transaction
      description: Production backends own state, nonce, PKCE, the identity-provider callback, and the exact redirect URI. The returned URL is generated only from trusted provider configuration.
      requestBody:
        $ref: '#/components/requestBodies/SsoStartInput'
      responses:
        '200':
          $ref: '#/components/responses/SsoStartSuccess'
        default:
          $ref: '#/components/responses/Error'
  /auth/sso/exchange:
    post:
      security: []
      summary: Atomically exchange a one-time SSO completion ticket
      description: The ticket is short-lived, browser-transaction-bound in production, and consumed before an application session is issued.
      requestBody:
        $ref: '#/components/requestBodies/SsoExchangeInput'
      responses:
        '200':
          $ref: '#/components/responses/SsoExchangeSuccess'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    $ref: '#/components/pathItems/ActionCreate'
  /auth/me:
    get:
      summary: Read the current identity and authorization snapshot atomically
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedPrincipalSuccess'
        default:
          $ref: '#/components/responses/Error'
  /auth/forgot-password:
    post:
      security: []
      summary: Request a password-reset message
      requestBody:
        $ref: '#/components/requestBodies/ForgotPasswordInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/reset-password:
    post:
      security: []
      summary: Complete a password reset
      requestBody:
        $ref: '#/components/requestBodies/ResetPasswordInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/change-password:
    $ref: '#/components/pathItems/ChangePasswordCreate'
  /auth/profile:
    $ref: '#/components/pathItems/ProfileUpdate'
  /navigation:
    $ref: '#/components/pathItems/Read'
  /dashboard/overview:
    $ref: '#/components/pathItems/Read'
  /system-config:
    $ref: '#/components/pathItems/SystemConfigResource'
  /uploads/policy:
    get:
      summary: Read the authenticated browser-safe upload policy
      description: Returns only the global byte ceiling, canonical extension allow-list, and policy revision time. Storage provider, endpoint, bucket, path, and credentials are intentionally excluded.
      responses:
        '200':
          $ref: '#/components/responses/UploadPolicySuccess'
        default:
          $ref: '#/components/responses/Error'
  /form-workbench/title-availability:
    $ref: '#/components/pathItems/Read'
  /form-workbench/submissions:
    $ref: '#/components/pathItems/FormSubmissionCreate'
  /component-gallery/form/service-owners:
    $ref: '#/components/pathItems/Read'
  /component-gallery/form/submissions:
    post:
      summary: Atomically submit schema-driven fields and evidence bytes
      description: The application/json submission part and up to three evidence files are validated before any file or submission record is retained.
      requestBody:
        $ref: '#/components/requestBodies/SchemaDrivenMultipartSubmission'
      responses:
        '201':
          $ref: '#/components/responses/SchemaDrivenSubmissionSuccess'
        default:
          $ref: '#/components/responses/Error'
  /roles:
    $ref: '#/components/pathItems/Read'
  /roles/{id}:
    $ref: '#/components/pathItems/RolePolicyResource'
  /users:
    $ref: '#/components/pathItems/UserCollection'
  /users/import:
    post:
      summary: Import users from a bounded UTF-8 CSV file
      description: The global upload policy must allow the csv extension. The user-import contract remains the stricter authority for content type, schema, row count, and its 256 KiB byte ceiling.
      parameters:
        - $ref: '#/components/parameters/FileName'
      requestBody:
        required: true
        description: Raw CSV bytes, limited by the intersection of the runtime global policy and the service's 256 KiB and 200-data-row limits.
        content:
          text/csv:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          application/csv:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          application/vnd.ms-excel:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /users/{id}:
    $ref: '#/components/pathItems/UserResource'
  /positions:
    $ref: '#/components/pathItems/PositionCollection'
  /positions/{id}:
    $ref: '#/components/pathItems/PositionResource'
  /departments:
    $ref: '#/components/pathItems/DepartmentCollection'
  /departments/{id}:
    $ref: '#/components/pathItems/DepartmentResource'
  /system-menus:
    $ref: '#/components/pathItems/ManagedMenuCollection'
  /system-menus/{id}:
    $ref: '#/components/pathItems/ManagedMenuResource'
  /system-parameters:
    $ref: '#/components/pathItems/SystemParameterCollection'
  /system-parameters/{id}:
    $ref: '#/components/pathItems/SystemParameterResource'
  /dictionaries/types:
    $ref: '#/components/pathItems/DictionaryTypeCollection'
  /dictionaries/types/{id}:
    $ref: '#/components/pathItems/DictionaryTypeResource'
  /dictionaries/types/{id}/entries:
    $ref: '#/components/pathItems/DictionaryEntryCollection'
  /dictionaries/entries/{id}:
    $ref: '#/components/pathItems/DictionaryEntryResource'
  /dictionaries/options/{id}:
    $ref: '#/components/pathItems/ResourceRead'
  /announcements:
    $ref: '#/components/pathItems/AnnouncementCollection'
  /announcements/{id}:
    $ref: '#/components/pathItems/AnnouncementResource'
  /announcements/{id}/status:
    $ref: '#/components/pathItems/AnnouncementStatusResource'
  /content-files:
    get:
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Upload a validated content file
      description: The effective allow-list and byte ceiling are the intersection of the authenticated runtime upload policy and the content service's fixed types and 5 MiB business limit. A global setting can narrow but never broaden those service limits.
      parameters:
        - $ref: '#/components/parameters/FileName'
      requestBody:
        required: true
        description: Raw file bytes. The service enforces the effective extension, MIME, signature, and byte-size policy independently of browser checks.
        content:
          application/pdf:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          image/jpeg:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          image/png:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          image/webp:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          text/csv:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
          text/plain:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /content-files/{id}:
    $ref: '#/components/pathItems/ResourceDelete'
  /content-files/{id}/download:
    get:
      parameters:
        - $ref: '#/components/parameters/Identifier'
      summary: Download the original content-file bytes
      responses:
        '200':
          $ref: '#/components/responses/ContentFileDownload'
        default:
          $ref: '#/components/responses/Error'
  /content-files/{id}/preview:
    get:
      parameters:
        - $ref: '#/components/parameters/Identifier'
      summary: Preview supported image bytes inline
      responses:
        '200':
          $ref: '#/components/responses/ContentFilePreview'
        default:
          $ref: '#/components/responses/Error'
  /operation-logs:
    $ref: '#/components/pathItems/SensitiveRead'
  /operation-logs/{id}:
    $ref: '#/components/pathItems/SensitiveResourceRead'
  /notifications:
    $ref: '#/components/pathItems/Read'
  /notifications/unread-count:
    $ref: '#/components/pathItems/Read'
  /notifications/{id}/read:
    $ref: '#/components/pathItems/ResourceActionUpdate'
  /notifications/read-all:
    $ref: '#/components/pathItems/NotificationReadAllCreate'
  /monitoring/overview:
    $ref: '#/components/pathItems/SensitiveRead'
  /monitoring/sessions/{id}/terminate:
    $ref: '#/components/pathItems/ResourceActionCreate'
  /monitoring/jobs/{id}/run:
    $ref: '#/components/pathItems/ResourceActionCreate'
  /monitoring/caches/{id}/clear:
    $ref: '#/components/pathItems/ResourceActionCreate'
  /component-gallery/uploads/{id}/chunks/{chunkIndex}:
    parameters:
      - $ref: '#/components/parameters/Identifier'
      - $ref: '#/components/parameters/ChunkIndex'
    post:
      summary: Upload one deterministic demo chunk
      parameters:
        - $ref: '#/components/parameters/DemoTotalChunks'
        - $ref: '#/components/parameters/DemoFileName'
        - $ref: '#/components/parameters/DemoFailOnce'
      requestBody:
        required: true
        description: One non-empty raw chunk. Each chunk is limited to 64 KiB.
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/BinaryPayload'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /component-gallery/uploads/{id}/complete:
    post:
      parameters:
        - $ref: '#/components/parameters/Identifier'
      summary: Complete a deterministic demo upload
      requestBody:
        $ref: '#/components/requestBodies/DemoUploadCompletion'
      responses:
        '201':
          $ref: '#/components/responses/DemoUploadCompletion'
        default:
          $ref: '#/components/responses/Error'
  /component-gallery/uploads/{id}:
    $ref: '#/components/pathItems/ResourceDelete'
  /component-gallery/files/{id}:
    get:
      parameters:
        - $ref: '#/components/parameters/Identifier'
      summary: Download one completed deterministic demo upload
      responses:
        '200':
          $ref: '#/components/responses/DemoUploadDownload'
        default:
          $ref: '#/components/responses/Error'
  /contract-scenarios/delay:
    get:
      security: []
      summary: Return a deterministic delayed success in the local Mock server
      responses:
        '200':
          description: Delayed success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /contract-scenarios/timeout:
    get:
      security: []
      summary: Exceed the deliberately small local contract-test timeout
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /contract-scenarios/failures/{scenario}:
    get:
      security: []
      summary: Return a deterministic failure in the local Mock server
      parameters:
        - name: scenario
          in: path
          required: true
          schema:
            type: string
            enum: [unauthorized, forbidden, conflict, validation, server-error]
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
  parameters:
    Identifier:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChunkIndex:
      name: chunkIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    FileName:
      name: X-File-Name
      in: header
      required: true
      description: URI-encoded original display name. The service sanitizes it before persistence.
      schema:
        type: string
        minLength: 1
        maxLength: 720
    DemoTotalChunks:
      name: X-Demo-Total-Chunks
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 128
    DemoFileName:
      name: X-Demo-File-Name
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 720
    DemoFailOnce:
      name: X-Demo-Fail-Once
      in: header
      required: false
      schema:
        type: string
        enum: ['true', 'false']
  requestBodies:
    # AI modified: every JSON mutation references a closed domain DTO instead of an open object.
    LoginInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginInput'
    SsoExchangeInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SsoExchangeInput'
    SsoStartInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SsoStartInput'
    ForgotPasswordInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgotPasswordInput'
    ResetPasswordInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetPasswordInput'
    ChangePasswordInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangePasswordInput'
    UpdateProfileInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProfileInput'
    SystemConfigInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemConfigInput'
    FormWorkbenchSubmitInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormWorkbenchSubmitInput'
    SchemaDrivenMultipartSubmission:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [submission]
            properties:
              submission:
                $ref: '#/components/schemas/SchemaDrivenSubmissionFields'
              evidence:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/BinaryPayload'
          encoding:
            submission:
              contentType: application/json
            evidence:
              contentType: application/pdf, image/jpeg, image/png, text/csv
    UpdateRolePolicyInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRolePolicyInput'
    UserInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserInput'
    PositionInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PositionInput'
    DepartmentInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DepartmentInput'
    ManagedMenuInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagedMenuInput'
    SystemParameterInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemParameterInput'
    DictionaryTypeInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictionaryTypeInput'
    DictionaryEntryInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictionaryEntryInput'
    AnnouncementInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnouncementInput'
    AnnouncementStatusInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnouncementStatusInput'
    MarkAllNotificationsReadInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarkAllNotificationsReadInput'
    DemoUploadCompletion:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoUploadCompletionInput'
  headers:
    # AI modified: browser-sensitive payloads share one explicit non-cacheable response contract.
    NoStore:
      description: Prevent browsers and intermediaries from retaining a sensitive response.
      required: true
      schema:
        type: string
        const: no-store
    RequestId:
      description: Server correlation identifier. Clients also send X-Request-ID when starting a trace.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Success:
      description: Successful operation using the shared envelope
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    LoginSuccess:
      description: Password-authenticated application session and authorization snapshot
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginEnvelope'
    AuthenticatedPrincipalSuccess:
      description: Current identity and versioned authorization snapshot
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticatedPrincipalEnvelope'
    SsoConfigurationSuccess:
      description: Safe public SSO login configuration
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SsoConfigurationEnvelope'
    SsoExchangeSuccess:
      description: Authenticated application session created from an SSO identity
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SsoExchangeEnvelope'
    SsoStartSuccess:
      description: Backend-created SSO transaction and trusted identity-provider authorization URL
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SsoStartEnvelope'
    UploadPolicySuccess:
      description: Authenticated browser-safe global upload policy
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadPolicyEnvelope'
    SystemConfigSuccess:
      description: Explicit masked system-configuration projection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemConfigEnvelope'
    SensitiveSuccess:
      description: Sensitive successful operation using the shared envelope
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    SchemaDrivenSubmissionSuccess:
      description: Schema-driven release request and uploaded evidence receipts
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaDrivenSubmissionEnvelope'
    Error:
      description: Business or transport failure
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    ContentFileDownload:
      description: Original content-file bytes
      headers:
        Content-Disposition:
          schema:
            type: string
            pattern: ^attachment;
        X-Content-Type-Options:
          schema:
            type: string
            enum: [nosniff]
      content:
        application/pdf:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/jpeg:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/png:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/webp:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        text/csv:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        text/plain:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
    ContentFilePreview:
      description: Inline image preview bytes
      headers:
        X-Content-Type-Options:
          schema:
            type: string
            enum: [nosniff]
      content:
        image/jpeg:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/png:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/webp:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
    DemoUploadCompletion:
      description: Completed deterministic demo upload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoUploadCompletionEnvelope'
    DemoUploadDownload:
      description: Uploaded demo file bytes
      headers:
        Content-Disposition:
          schema:
            type: string
            pattern: ^attachment;
        X-Content-Type-Options:
          schema:
            type: string
            enum: [nosniff]
      content:
        application/pdf:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/jpeg:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        image/png:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
        text/csv:
          schema:
            $ref: '#/components/schemas/BinaryPayload'
  schemas:
    JsonValue:
      description: JSON value additionally limited at runtime to depth 40 and 50,000 aggregate nodes.
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
          maxLength: 1000000
        - type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/JsonValue'
        - type: object
          maxProperties: 50000
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
    SafeHttpUrl:
      type: string
      format: uri
      pattern: '^https?://(?![^/?#]*@)'
      maxLength: 4000
      description: Absolute HTTP(S) URL without embedded credentials.
    OptionalSafeHttpUrl:
      oneOf:
        - type: string
          const: ''
        - $ref: '#/components/schemas/SafeHttpUrl'
    SecretMask:
      description: Indicates whether a backend-owned secret exists without exposing its value.
      oneOf:
        - type: string
          const: ••••••••
        - type: 'null'
    UploadPathPrefix:
      description: Empty or a relative object-key prefix without absolute paths, empty segments, or traversal segments.
      oneOf:
        - type: string
          const: ''
        - type: string
          maxLength: 500
          pattern: '^(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*$'
    S3Region:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[a-z0-9][a-z0-9-]{0,99}$'
      description: Trimmed lower-case S3 region identifier.
    OptionalS3Region:
      oneOf:
        - type: string
          const: ''
        - $ref: '#/components/schemas/S3Region'
    S3BucketName:
      type: string
      minLength: 3
      maxLength: 63
      pattern: '^(?!.*\.\.)(?!\d{1,3}(?:\.\d{1,3}){3}$)[a-z0-9][a-z0-9.-]*[a-z0-9]$'
      description: Trimmed S3 bucket name without adjacent dots or an IPv4-address form.
