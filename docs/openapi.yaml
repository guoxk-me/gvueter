        authorization:
          $ref: '#/components/schemas/AuthorizationSnapshot'
        tenantId:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Backend-selected tenant; null is an explicitly unscoped single-tenant session.
