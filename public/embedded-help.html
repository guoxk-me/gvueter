<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin integration guide</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2.5rem;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        letter-spacing: -0.03em;
      }
      p {
        max-width: 44rem;
        color: color-mix(in srgb, CanvasText 68%, transparent);
        line-height: 1.7;
      }
      code {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 0.375rem;
        padding: 0.15rem 0.35rem;
      }
    </style>
  </head>
  <body>
    <!-- AI modified: same-origin content keeps the iframe route testable without third-party framing policy. -->
    <main>
      <h1>Embedded integration guide</h1>
      <p>
        This page demonstrates the validated iframe menu contract. Production integrations should
        restrict iframe origins through backend configuration and a Content Security Policy.
      </p>
      <p>Menu component key: <code>iframe</code></p>
    </main>
  </body>
</html>
