services:
  frontend:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-local}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_ENABLE_PWA: ${VITE_ENABLE_PWA:-false}
    environment:
      APP_BASE_PATH: ${VITE_BASE_PATH:-/}
      API_UPSTREAM: ${API_UPSTREAM:-}
      BACKEND_READY_PATH: ${BACKEND_READY_PATH:-/api/health/ready}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
      CSP_FRAME_SRC_EXTRA: ${CSP_FRAME_SRC_EXTRA:-}
    ports:
      - '${GVUETER_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
