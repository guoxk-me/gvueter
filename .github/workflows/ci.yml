name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, main-admin]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run build
      - run: pnpm run test:e2e
        env:
          CI: 'true'
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: browser-evidence
          path: test-results/

  pwa:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
        env:
          VITE_BASE_PATH: /admin/
          VITE_ENABLE_PWA: 'true'
      - run: pnpm run test:e2e:pwa
        env:
          CI: 'true'

  container:
    needs: [verify, browser, pwa]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build reference container
        run: docker build --build-arg VCS_REF="${{ github.sha }}" -t gvueter-ci:${{ github.sha }} .
      - name: Smoke-test standalone and paired modes
        run: |
          docker network create gvueter-ci-network
          docker run -d --name gvueter-standalone --network gvueter-ci-network -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:mode=1777 --cap-drop ALL --security-opt no-new-privileges gvueter-ci:${{ github.sha }}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs gvueter-standalone; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/runtime-config.json | grep --fixed-strings '"schemaVersion":2'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/probe)" = 503
          docker rm -f gvueter-standalone
          docker run -d --name gvueter-backend --network gvueter-ci-network --network-alias backend node:24.18.0-alpine3.23 node -e 'require("node:http").createServer((req,res)=>{res.setHeader("Content-Type","application/json");res.end(JSON.stringify({url:req.url,requestId:req.headers["x-request-id"]??null}))}).listen(8080,"0.0.0.0")'
          docker run -d --name gvueter-paired --network gvueter-ci-network -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:mode=1777 --cap-drop ALL --security-opt no-new-privileges -e API_UPSTREAM=http://backend:8080 -e PUBLIC_API_BASE_URL=/api/v1 -e BACKEND_READY_PATH=/api/health/ready gvueter-ci:${{ github.sha }}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs gvueter-paired; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/probe | grep --fixed-strings '"url":"/api/v1/probe"'
          docker rm -f gvueter-paired gvueter-backend
          docker network rm gvueter-ci-network
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: gvueter-ci:${{ github.sha }}
          format: spdx-json
          output-file: container-sbom.spdx.json
      - name: Scan fixed high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          fail-build: true
          image: gvueter-ci:${{ github.sha }}
          only-fixed: true
          severity-cutoff: high
