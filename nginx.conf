pid /tmp/gvueter-runtime/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/gvueter-runtime/client-body;
  fastcgi_temp_path /tmp/gvueter-runtime/fastcgi;
  proxy_temp_path /tmp/gvueter-runtime/proxy;
  scgi_temp_path /tmp/gvueter-runtime/scgi;
  uwsgi_temp_path /tmp/gvueter-runtime/uwsgi;

  map $http_x_request_id $gvueter_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
  }

  log_format gvueter_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'request_id=$gvueter_request_id';
  access_log /dev/stdout gvueter_safe;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
    set $api_upstream "${API_UPSTREAM}";
    set $readiness_upstream "${API_UPSTREAM}${BACKEND_READY_PATH}";
    set $response_cache_control "no-cache";

    # AI modified: immutable assets follow the configured application Base path.
    if ($uri ~ ^${APP_BASE_PATH}assets/) {
      set $response_cache_control "public, max-age=31536000, immutable";
    }
    if ($uri = ${APP_BASE_PATH}runtime-config.json) {
      set $response_cache_control "no-store";
    }

    add_header Cache-Control $response_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src ${CSP_CONNECT_SRC}; font-src 'self'; form-action 'self'; frame-src ${CSP_FRAME_SRC}; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Request-ID $gvueter_request_id always;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}\n';
    }

    location = /readyz {
      access_log off;
      # AI modified: a standalone frontend is ready without requiring an undeployed backend.
      if ($api_upstream = "") {
        return 200 '{"status":"ready"}\n';
      }
      proxy_pass $readiness_upstream;
      proxy_connect_timeout 2s;
      proxy_intercept_errors on;
      proxy_method HEAD;
      proxy_pass_request_body off;
      proxy_read_timeout 2s;
      proxy_set_header X-Request-ID $gvueter_request_id;
      error_page 500 502 503 504 =503 @not_ready;
    }

    location @not_ready {
      internal;
      default_type application/json;
      return 503 '{"status":"not-ready"}\n';
    }

    location = ${APP_BASE_PATH}runtime-config.json {
      alias /tmp/gvueter-runtime/runtime-config.json;
      default_type application/json;
    }

    location = ${APP_BASE_PATH}pwa-sw.js {
      try_files $uri =404;
    }

    location = ${APP_BASE_PATH}manifest.webmanifest {
      try_files $uri =404;
    }

    location ${APP_BASE_PATH}assets/ {
      try_files $uri =404;
    }

    location /api/ {
      # AI modified: API paths never fall back to HTML when no backend is configured.
      if ($api_upstream = "") {
        return 503;
      }
      proxy_pass $api_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $gvueter_request_id;
    }

    location ${APP_BASE_PATH} {
      try_files $uri $uri/ ${APP_BASE_PATH}index.html;
    }
  }
}
