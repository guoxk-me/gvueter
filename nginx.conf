server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # AI modified: the proxy accepts the same 5 MiB request-body ceiling enforced by file APIs.
  client_max_body_size 5m;

  # AI modified: defer backend DNS resolution until an API/readiness request reaches the container.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
  set $api_upstream "http://${API_UPSTREAM}";
  set $response_referrer_policy "strict-origin-when-cross-origin";

  # AI modified: one inherited cache header avoids dropping security headers in child locations.
  set $response_cache_control "no-cache";
  if ($uri ~ ^/assets/) {
    set $response_cache_control "public, max-age=31536000, immutable";
  }
  if ($uri ~ ^/api/) {
    set $response_cache_control "";
  }
  if ($uri = /healthz) {
    set $response_cache_control "";
  }
  if ($uri = /readyz) {
    set $response_cache_control "";
  }
  # AI modified: reset codes embedded in SPA paths must not escape through same-origin Referer headers.
  if ($uri ~ ^/reset-password(?:/|$)) {
    set $response_referrer_policy "no-referrer";
  }
  # AI modified: SSO completion fragments receive defense-in-depth no-store/referrer headers.
  if ($uri ~ ^/sso/callback(?:/|$)) {
    set $response_referrer_policy "no-referrer";
    set $response_cache_control "no-store";
  }

  add_header Cache-Control $response_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy $response_referrer_policy always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # AI modified: deployers must align these sources with the frontend URL allow-lists.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src ${CSP_CONNECT_SRC}; font-src 'self'; form-action 'self'; frame-src ${CSP_FRAME_SRC}; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # AI modified: readiness verifies the configured API dependency separately from container liveness.
  location = /readyz {
    access_log off;
    # AI modified: gvueter's paired gnester-lite backend exposes production readiness here.
    proxy_pass $api_upstream/health/ready;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
  }

  location /assets/ {
    try_files $uri =404;
  }

  # AI modified: suppress request-line logging for reset codes without redefining inherited security headers.
  location ~ ^/reset-password(?:/|$) {
    access_log off;
    try_files /index.html =404;
  }

  location ~ ^/sso/callback(?:/|$) {
    access_log off;
    try_files /index.html =404;
  }

  # AI modified: history-mode routes fall back to the SPA entry without hiding missing assets.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Preserve the previous public `/api/` stripping contract when proxy_pass uses a runtime variable.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
