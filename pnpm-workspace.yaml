# AI modified: the PWA asset generator uses Sharp to derive deterministic install icons from one SVG.
allowBuilds:
  sharp: true
# AI modified: peers must be declared explicitly so optional tooling cannot silently enter the lockfile.
autoInstallPeers: false
shellEmulator: true
overrides:
  # AI modified: keep the Vue runtime and compilers on one stable release instead of mixed beta builds.
  '@vue/compiler-core': 3.5.39
  '@vue/compiler-dom': 3.5.39
  '@vue/compiler-sfc': 3.5.39
  '@vue/compiler-ssr': 3.5.39
  '@vue/reactivity': 3.5.39
  '@vue/runtime-core': 3.5.39
  '@vue/runtime-dom': 3.5.39
  '@vue/server-renderer': 3.5.39
  '@vue/shared': 3.5.39
  # AI modified: axios' transitive multipart dependency must stay on the patched release.
  form-data: 4.0.6
  # AI modified: patch the Nano ID zero-size infinite loop in the Vite/PostCSS dependency chain.
  nanoid: 3.3.18
  # AI modified: block the previous-source-map path traversal fixed after PostCSS 8.5.17.
  postcss: 8.5.23
  # AI modified: resolve@1.22.12 ships .claude files that break installs in this environment.
  resolve: 1.22.11
  vite: 'catalog:'
  vitest: 'catalog:'

  vue: 3.5.39

catalog:
  '@antfu/eslint-config': ^9.1.0
  '@axe-core/playwright': 4.12.1
  '@casl/ability': ^6.8.1
  '@casl/vue': ^2.2.6
  '@fontsource/inter': ^5.2.8
  # AI modified: calendar and date-field primitives share one date catalog entry.
  '@internationalized/date': ^3.12.3
  '@lucide/vue': ^1.25.0
  '@playwright/test': ^1.61.1
  '@tailwindcss/vite': ^4.3.2
  '@tanstack/vue-query': ^5.101.2
  '@tanstack/vue-table': ^8.21.3
  '@tanstack/vue-virtual': ^3.13.31
  '@tsconfig/node24': ^24.0.4
  '@types/jsdom': ^28.0.3
  '@types/node': ^24.13.3
  '@types/qrcode': ^1.5.6
  # AI modified: Antfu's command plugin declares rule-tester as a required peer under strict pnpm resolution.
  '@typescript-eslint/rule-tester': ^8.63.0
  '@unovis/ts': ^1.6.7
  '@unovis/vue': ^1.6.7
  '@vee-validate/zod': ^4.15.1
  '@vite-pwa/assets-generator': 1.0.2
  '@vitejs/plugin-vue': ^6.0.7
  # AI modified: Vitest and its coverage provider stay on the same stable release.
  '@vitest/coverage-v8': 4.1.11
  '@vue/test-utils': ^2.4.11
  '@vue/tsconfig': ^0.9.1
  '@vueup/vue-quill': ^1.5.5
  '@vueuse/core': ^14.3.0
  axios: ^1.18.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dayjs: ^1.11.21
  # AI modified: carousel UI depends on Embla through a workspace catalog pin.
  embla-carousel-vue: ^8.6.0
  eslint: ^10.6.0
  husky: ^9.1.7
  jiti: ^2.7.0
  jsdom: ^29.1.1
  lint-staged: ^17.0.8
  motion-v: ^2.3.0
  msw: ^2.15.0
  npm-run-all2: ^8.0.4
  nprogress: ^0.2.0
  pinia: ^3.0.4
  pinia-plugin-persistedstate: ^4.7.1
  qrcode: ^1.5.4
  reka-ui: ^2.10.1
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.2
  tw-animate-css: ^1.4.0
  typescript: ~6.0.3
  unplugin-auto-import: ^21.0.0
  # AI modified: drawer primitive uses Vaul through a workspace catalog pin.
  vaul-vue: ^0.4.1
  vee-validate: ^4.15.1
  # AI modified: use the stable official Vite and Vitest packages without toolchain aliases.
  vite: ^8.2.2
  vite-plugin-pwa: 1.3.0
  vite-plugin-vue-devtools: ^8.1.5
  vitest: 4.1.11
  vue: 3.5.39
  vue-i18n: 11.4.6
  # AI modified: OTP input primitive shares one catalog entry across the workspace.
  vue-input-otp: ^0.3.2
  vue-router: ^5.1.0
  vue-sonner: ^2.0.9
  vue-tsc: ^3.3.7
  workbox-window: 7.4.1
