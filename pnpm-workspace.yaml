# AI modified: the PWA asset generator uses Sharp to derive deterministic install icons from one SVG.
# AI modified: peers must be declared explicitly so optional tooling cannot silently enter the lockfile.
autoInstallPeers: false
shellEmulator: true

overrides:
  # AI modified: keep Babel's trusted-build pipeline on the patched source-map handling release.
  '@babel/core': 7.29.6
  # AI modified: align typescript-eslint parser with the plugin selected by Antfu ESLint config.
  '@typescript-eslint/parser': 8.70.0
  # AI modified: keep the Vue runtime and compilers on one stable release instead of mixed beta builds.
  '@vue/compiler-core': 3.5.42
  '@vue/compiler-dom': 3.5.42
  '@vue/compiler-sfc': 3.5.42
  '@vue/compiler-ssr': 3.5.42
  '@vue/reactivity': 3.5.42
  '@vue/runtime-core': 3.5.42
  '@vue/runtime-dom': 3.5.42
  '@vue/server-renderer': 3.5.42
  '@vue/shared': 3.5.42
  # AI modified: pin vulnerable build and lint transitive dependencies to their patched lines.
  browserslist: 4.28.9
  fast-uri: 3.1.6
  # AI modified: axios' transitive multipart dependency must stay on the patched release.
  form-data: 4.0.6
  minimatch@10.2.5>brace-expansion: 5.0.9
  minimatch@5.1.9>brace-expansion: 2.1.4
  # AI modified: patch the Nano ID zero-size infinite loop in the Vite/PostCSS dependency chain.
  nanoid: 3.3.18
  # AI modified: block the previous-source-map path traversal fixed after PostCSS 8.5.17.
  postcss: 8.5.28
  # AI modified: resolve@1.22.12 ships .claude files that break installs in this environment.
  resolve: 1.22.11
  vite: 'catalog:'
  vitest: 'catalog:'

  vue: 3.5.42

allowBuilds:
  # AI modified: explicitly deny optional hooks so pnpm 12 strict build review stays reproducible.
  msw: false
  sharp: true
  vue-demi: false

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@axe-core/playwright': 4.13.0
  '@casl/ability': ^7.0.1
  '@casl/vue': ^3.0.1
  '@fontsource/inter': ^5.3.0
  # AI modified: calendar and date-field primitives share one date catalog entry.
  '@internationalized/date': ^3.12.4
  '@lucide/vue': ^1.45.0
  # AI modified: retry Playwright 1.63 after hardening the supported-browser readiness checks.
  '@playwright/test': 1.63.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/vue-query': ^5.102.8
  # AI modified: Table 9 is adopted with explicit feature profiles in both table wrappers.
  '@tanstack/vue-table': ^9.2.4
  '@tanstack/vue-virtual': ^3.13.38
  '@tsconfig/node24': ^24.0.5
  '@types/jsdom': ^30.0.0
  '@types/node': ^24.13.3
  '@types/qrcode': ^1.5.6
  # AI modified: Antfu's command plugin declares rule-tester as a required peer under strict pnpm resolution.
  '@typescript-eslint/rule-tester': ^8.70.0
  '@unovis/ts': ^1.7.0
  '@unovis/vue': ^1.7.0
  '@vee-validate/zod': ^4.15.1
  '@vite-pwa/assets-generator': 1.0.3
  '@vitejs/plugin-vue': ^6.0.8
  # AI modified: Vitest and its coverage provider stay on the same stable release.
  '@vitest/coverage-v8': 5.0.0
  '@vue/test-utils': ^2.5.0
  '@vue/tsconfig': ^0.9.1
  '@vueup/vue-quill': ^1.5.5
  '@vueuse/core': ^14.4.0
  axios: ^1.20.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  # AI modified: carousel UI depends on Embla through a workspace catalog pin.
  embla-carousel-vue: ^8.6.0
  eslint: ^10.10.0
  # AI modified: authenticated Dashboard SSE uses a fetch-based client so Bearer tokens never enter URLs.
  eventsource-client: 1.2.0
  husky: ^9.1.7
  jiti: ^2.7.0
  jsdom: ^30.0.1
  # AI modified: source and dependency inventory now has a reviewable exact-issue baseline.
  knip: 6.35.1
  lint-staged: ^17.5.1
  motion-v: ^2.4.2
  msw: ^2.15.0
  npm-run-all2: ^9.0.3
  nprogress: ^0.2.0
  # AI modified: generated transport DTOs use the stable runtime-free OpenAPI generator.
